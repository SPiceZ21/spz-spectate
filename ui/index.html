<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>spz-spectate</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="root" class="hidden">

    <!-- top bar: eyebrow + controls -->
    <div class="spec-top">
      <div class="spec-eyebrow"><span class="dot"></span> SPECTATING</div>
      <div class="spec-ctrl">
        <span class="kc">Q</span>
        <span class="kc">R</span>
        <span class="fsep">CYCLE</span>
        <span id="counter" class="counter">1 / 1</span>
        <span class="kc esc">ESC</span>
        <span class="fsep">EXIT</span>
      </div>
    </div>

    <!-- module row: identity · status · speed -->
    <div class="spec-row">

      <div class="mod mod-id">
        <img id="flag" class="id-flag hidden" src="" alt="">
        <span id="num" class="id-num hidden">00</span>
        <span id="name" class="id-name">—</span>
        <span id="rec" class="id-rec hidden">REC</span>
        <span id="rank" class="chip chip-rank hidden">D-5</span>
        <span id="crew" class="chip chip-crew hidden"></span>
      </div>

      <div class="mod mod-status">
        <span class="mod-label">STATUS</span>
        <span id="status" class="status-val freeroam">FREEROAM</span>
      </div>

      <div class="mod mod-speed">
        <span class="mod-label">SPEED</span>
        <span id="speed" class="speed-val">0</span>
        <span class="speed-unit">KM/H</span>
        <span id="veh" class="speed-veh">On foot</span>
      </div>

    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
